        <!-- Filters -->
        <div class="filters-bar">
          <div class="filter-group">
            <label for="objectSoortFilter">Objectsoort:</label>
            <select id="objectSoortFilter">
              <option value="">Alle</option>
              <option value="gebouw">Gebouw</option>
              <option value="complex">Complex</option>
              <option value="sectie">Sectie</option>
              <option value="unit">Unit</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="typeFilter">Type:</label>
            <select id="typeFilter">
              <option value="">Alle</option>
              <option value="bedrijfspand">Bedrijfspand</option>
              <option value="woning">Woning</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="statusFilter">Status:</label>
            <select id="statusFilter">
              <option value="">Alle</option>
              <option value="verhuurd">Verhuurd</option>
              <option value="beschikbaar">Beschikbaar</option>
              <option value="onderhoud">Onderhoud</option>
            </select>
          </div>

          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Zoek op adres of naam..."
            />
          </div>
        </div>

        <!-- Panden List -->
        <div id="pandenList" class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Object</th>
                <th>Type</th>
                <th>Adres</th>
                <th>Postcode</th>
                <th>Plaats</th>
                <th>Status</th>
                <th>Huurprijs</th>
                <th>Acties</th>
              </tr>
            </thead>
            <tbody id="pandenTableBody">
              <tr>
                <td colspan="8" class="empty-state">
                  Geen panden gevonden. Klik op "Nieuw Pand" om te beginnen.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>

    <!-- Modal for Add/Edit Pand -->
    <div
      id="pandModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Nieuw Pand</h2>
          <button class="close-btn" id="closeModal" aria-label="Sluiten">
            &times;
          </button>
        </div>

        <form id="pandForm">
          <input type="hidden" id="pandId" />

          <div class="form-row">
            <div class="form-group">
              <label for="objectSoort">Objectsoort *</label>
              <select id="objectSoort" required>
                <option value="">Selecteer objectsoort</option>
                <option value="gebouw">Gebouw</option>
                <option value="complex">Complex</option>
                <option value="sectie">Sectie</option>
                <option value="unit">Unit</option>
              </select>
            </div>

            <div class="form-group">
              <label for="type">Type *</label>
              <select id="type" required>
                <option value="">Selecteer type</option>
                <option value="bedrijfspand">Bedrijfspand</option>
                <option value="woning">Woning</option>
              </select>
            </div>

            <div class="form-group">
              <label for="status">Status *</label>
              <select id="status" required>
                <option value="beschikbaar">Beschikbaar</option>
                <option value="verhuurd">Verhuurd</option>
                <option value="onderhoud">Onderhoud</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="objectNummer">Objectnummer</label>
              <input type="text" id="objectNummer" placeholder="OBJ-001" />
            </div>

            <div class="form-group">
              <label for="parentObjectId">Bovenliggend object</label>
              <select id="parentObjectId">
                <option value="">Geen</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="adres">Adres *</label>
            <input
              type="text"
              id="adres"
              required
              placeholder="Straatnaam 123"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="postcode">Postcode *</label>
              <input type="text" id="postcode" required placeholder="1234 AB" />
            </div>

            <div class="form-group">
              <label for="plaats">Plaats *</label>
              <input type="text" id="plaats" required placeholder="Amsterdam" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="oppervlakte">Oppervlakte (m²)</label>
              <input type="number" id="oppervlakte" placeholder="100" />
            </div>

            <div class="form-group">
              <label for="kamers">Aantal kamers</label>
              <input type="number" id="kamers" placeholder="3" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="bouwjaar">Bouwjaar</label>
              <input
                type="number"
                id="bouwjaar"
                placeholder="2000"
                min="1800"
                max="2100"
              />
            </div>

            <div class="form-group">
              <label for="energielabel">Energielabel</label>
              <select id="energielabel">
                <option value="">Selecteer label</option>
                <option value="A+++">A+++</option>
                <option value="A++">A++</option>
                <option value="A+">A+</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="bagId">BAG ID</label>
              <input type="text" id="bagId" placeholder="BAG identificatie" />
            </div>

            <div class="form-group">
              <label for="streefhuur">Streefhuur per maand (€)</label>
              <input
                type="number"
                id="streefhuur"
                step="0.01"
                placeholder="1750"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ownerNaam">Eigenaar / administratie</label>
              <input type="text" id="ownerNaam" placeholder="Naam eigenaar" />
            </div>

            <div class="form-group">
              <label for="beheerderNaam">Makelaar / beheerder</label>
              <input
                type="text"
                id="beheerderNaam"
                placeholder="Naam beheerder of makelaar"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="huurprijs">Huurprijs per maand (€) *</label>
            <input type="number" id="huurprijs" required placeholder="1500" />
          </div>

          <div class="form-group">
            <label for="beschrijving">Beschrijving</label>
            <textarea
              id="beschrijving"
              rows="4"
              placeholder="Aanvullende informatie over het pand..."
            ></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Annuleren
            </button>
            <button type="submit" class="btn-primary">Opslaan</button>
          </div>
        </form>
      </div>
    </div>
