        <header class="page-header">
          <h1>Werkbonnen Overzicht</h1>
          <div class="header-actions">
            <button class="search-shortcut" onclick="openGlobalSearch()">

                xmlns="http://www.w3.org/2000/svg"

                aria-hidden="true"

                <circle cx="11" cy="11" r="8"></circle>

              class="btn-icon"
              onclick="exportWerkbonnenCSV()"
              title="Exporteer naar CSV"
            >

                xmlns="http://www.w3.org/2000/svg"
                class="lucide-icon"
                aria-hidden="true"

                height="1em"

            </button>
          </div>

        <div class="filters-bar">
          <div class="filter-group">
            <label for="statusFilter">Status:</label>
            <select id="statusFilter">
              <option value="">Alle</option>
              <option value="aangemaakt">Aangemaakt</option>
              <option value="verstuurd">Verstuurd</option>
              <option value="gepland">Gepland</option>
              <option value="in-uitvoering">In uitvoering</option>
              <option value="afgerond">Afgerond</option>
              <option value="goedgekeurd">Goedgekeurd</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="jaarFilter">Jaar:</label>
            <select id="jaarFilter">
              <option value="">Alle jaren</option>
            </select>
          </div>

          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Zoek op werkbonnummer of adres..."
            />
          </div>
        </div>

        <div id="werkbonnenList" class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Werkbonnummer</th>
                <th>Adres</th>
                <th>Titel</th>
                <th>Prioriteit</th>
                <th>Status</th>
                <th>Aangemaakt</th>
                <th>Kosten</th>
                <th>Acties</th>
              </tr>
            </thead>
            <tbody id="werkbonnenTableBody">
              <tr>
                <td colspan="8" class="empty-state">
                  Geen werkbonnen gevonden.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
