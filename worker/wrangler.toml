name = "objctmgmt-api"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "bb3893fab785508c512caa687c340bda"

# Workers AI binding (Llama 3, Llava vision, etc.)
[ai]
binding = "AI"

# R2 bucket for documents and tenant assets (logos, etc.)
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "objctmgmt-documents"

# KV namespace for tenant settings (branding, admin config)
# Run once: npx wrangler kv namespace create TENANT_SETTINGS
# Then paste the returned id below.
[[kv_namespaces]]
binding = "TENANT_SETTINGS"
id = "ab3b52af2f014f6eb518523674f7ebe0"
preview_id = "e859571f4c5e43f5af60d85fa7fecd9a"

[vars]
# Allowed origins for CORS. Override per environment with `wrangler deploy --var`.
ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000,https://my-pwa-apps.github.io"
# Default Entra ID tenant ID for token validation. Set per tenant via secret.
ENTRA_TENANT_ID = ""
# Default Entra ID app (client) id - the audience claim that incoming tokens must match.
ENTRA_AUDIENCE = ""
# When "true", allow unauthenticated requests with `X-Demo-Mode: true` (dev only).
ALLOW_DEMO_MODE = "true"

# Secrets to set via:
#   npx wrangler secret put ENTRA_TENANT_ID
#   npx wrangler secret put ENTRA_AUDIENCE
#
# (Values in [vars] above are non-secret defaults; secrets override them.)
