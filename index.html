<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadsgezicht Ontwikkelingen - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <img src="images/stadsgezicht-logo.svg" alt="Stadsgezicht" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <h1 style="display: none;">Stadsgezicht</h1>
                <p class="subtitle">Vastgoedbeheer Systeem</p>
            </div>
            
            <div class="login-options">
                <!-- Entra ID SSO Login -->
                <button type="button" class="btn-primary btn-sso" id="entraLoginBtn">
                    <span class="icon">🔐</span>
                    Inloggen met Microsoft 365
                </button>
                
                <div class="divider">
                    <span>of</span>
                </div>
                
                <!-- Demo Mode -->
                <button type="button" class="btn-secondary btn-demo" id="demoModeBtn">
                    <span class="icon">👁️</span>
                    Demo Modus (Geen inlog vereist)
                </button>
                
                <p class="info-text">
                    <small><strong>Demo Modus:</strong> Verken de applicatie met voorbeeld data zonder configuratie.</small>
                </p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- MSAL.js for Entra ID -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
    
    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/entra-auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
