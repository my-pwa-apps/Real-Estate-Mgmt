<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com https://alcdn.msauth.net https://cdn.jsdelivr.net https://apis.google.com https://accounts.google.com https://*.google.com https://*.googleapis.com https://*.gstatic.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app https://login.microsoftonline.com https://*.microsoft.com https://*.openai.azure.com wss://*.firebaseio.com; img-src 'self' data:; font-src 'self'; frame-src 'self' https://login.microsoftonline.com https://*.firebaseapp.com;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stadsgezicht Ontwikkelingen - Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/jpeg" href="images/stadsgezicht-logo.jpg" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body class="login-page">
    <a href="#main-content" class="skip-to-content">Ga naar inhoud</a>
    <div class="login-container">
      <div class="login-box">
        <div class="logo-section">
          <img
            src="images/stadsgezicht-logo.jpg"
            alt="Stadsgezicht Ontwikkelingen"
            class="logo"
          />
          <p class="subtitle">Professioneel Vastgoedbeheer Platform</p>
        </div>

        <div class="login-options">
          <!-- Entra ID SSO Login -->
          <button type="button" class="btn-primary btn-sso" id="entraLoginBtn">
            <span class="icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                class="lucide-icon"
                aria-hidden="true"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg
            ></span>
            Inloggen met Microsoft 365
          </button>

          <div class="login-divider">
            <span>of</span>
          </div>

          <!-- Demo Mode -->
          <button type="button" class="btn-secondary btn-demo" id="demoModeBtn">
            <span class="icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                class="lucide-icon"
                aria-hidden="true"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                ></path>
                <circle cx="12" cy="12" r="3"></circle></svg
            ></span>
            Demo Modus (Geen inlog vereist)
          </button>

          <p class="info-text">
            <small
              ><strong>Demo Modus:</strong> Verken de applicatie met voorbeeld
              data zonder configuratie.</small
            >
          </p>
        </div>

        <div id="errorMessage" class="error-message"></div>
      </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" integrity="sha384-lI+CxEx/bCvWP1b0OK13j5HTrTZP7yf1xle8TVOFq2smz6KC1RChTarRV/RHP5PP" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js" integrity="sha384-M6AmjBRXEjkdGzRN1Y94xtkmblFbYBSLkqzyZ8rPvpRM2c48nhjIRFXVvUM/VATL" crossorigin="anonymous"></script>

    <!-- MSAL.js for Entra ID -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js" integrity="sha384-R+wLLONYXDy1SoHBdEDjMHWlX/SFBEPbEYP1Xy1cwm3qFwuIiL2TUWCp1VfmmAA1" crossorigin="anonymous"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/ui-utilities.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/entra-auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
