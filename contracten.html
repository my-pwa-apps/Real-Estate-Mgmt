        <div class="filters-bar">
          <div class="filter-group">
            <label for="contractFaseFilter">Fase:</label>
            <select id="contractFaseFilter">
              <option value="">Alle</option>
              <option value="concept">Concept</option>
              <option value="actief">Actief</option>
              <option value="opgezegd">Opgezegd</option>
              <option value="beeindigd">Beeindigd</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="statusFilter">Status:</label>
            <select id="statusFilter">
              <option value="">Alle</option>
              <option value="actief">Actief</option>
              <option value="verloopt">Verloopt binnenkort</option>
              <option value="verlopen">Verlopen</option>
            </select>
          </div>

          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Zoek op huurder of adres..."
            />
          </div>
        </div>

        <div id="contractenList" class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Huurder</th>
                <th>Pand</th>
                <th>Startdatum</th>
                <th>Einddatum</th>
                <th>Huurprijs</th>
                <th>Status</th>
                <th>Document</th>
                <th>Acties</th>
              </tr>
            </thead>
            <tbody id="contractenTableBody">
              <tr>
                <td colspan="9" class="empty-state">
                  Geen contracten gevonden.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

    <!-- Modal for Add/Edit Contract -->
    <div
      id="contractModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Nieuw Contract</h2>
          <button class="close-btn" id="closeModal" aria-label="Sluiten">
            &times;
          </button>
        </div>

        <form id="contractForm">
          <input type="hidden" id="contractId" />

          <div class="form-row">
            <div class="form-group">
              <label for="contractType">Contracttype *</label>
              <select id="contractType" required>
                <option value="">Selecteer contracttype</option>
                <option value="residentieel">Residentieel</option>
                <option value="commercieel">Commercieel</option>
                <option value="algemeen">Algemeen</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contractFase">Fase *</label>
              <select id="contractFase" required>
                <option value="concept">Concept</option>
                <option value="actief">Actief</option>
                <option value="opgezegd">Opgezegd</option>
                <option value="beeindigd">Beeindigd</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="huurderId">Huurder *</label>
            <select id="huurderId" required>
              <option value="">Selecteer huurder</option>
            </select>
          </div>

          <div class="form-group">
            <label for="pandId">Pand *</label>
            <select id="pandId" required>
              <option value="">Selecteer pand</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="startdatum">Startdatum *</label>
              <input type="date" id="startdatum" required />
            </div>

            <div class="form-group">
              <label for="einddatum">Einddatum *</label>
              <input type="date" id="einddatum" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="huurprijs">Huurprijs per maand (€) *</label>
              <input type="number" id="huurprijs" required step="0.01" />
            </div>

            <div class="form-group">
              <label for="borg">Borg (€)</label>
              <input type="number" id="borg" step="0.01" />
            </div>
          </div>

          <div class="form-group">
            <label for="betalingsdatum"
              >Betalingsdatum (dag van de maand)</label
            >
            <input
              type="number"
              id="betalingsdatum"
              min="1"
              max="31"
              value="1"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="indexatieMethode">Indexatiemethode</label>
              <select id="indexatieMethode">
                <option value="">Geen</option>
                <option value="cpi">CPI</option>
                <option value="cbs">CBS</option>
                <option value="vast-percentage">Vast percentage</option>
              </select>
            </div>

            <div class="form-group">
              <label for="waarborgType">Waarborgtype</label>
              <select id="waarborgType">
                <option value="">Niet van toepassing</option>
                <option value="borg">Borg</option>
                <option value="bankgarantie">Bankgarantie</option>
                <option value="geen">Geen</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="voorwaarden">Voorwaarden</label>
            <textarea
              id="voorwaarden"
              rows="4"
              placeholder="Bijzondere voorwaarden van het contract..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="contractReferentie">Externe referentie</label>
            <input
              type="text"
              id="contractReferentie"
              placeholder="Bijv. ERP of dossiervolgnummer"
            />
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Annuleren
            </button>
            <button type="submit" class="btn-primary">Opslaan</button>
          </div>
        </form>
      </div>
    </div>
