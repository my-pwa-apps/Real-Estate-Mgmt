                <path d="M12 5v14"></path>
              </svg>
              Nieuwe Relatie
            </button>
          </div>
        </header>

        <div class="filters-bar">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Zoek op naam, email of telefoon..."
            />
          </div>
          <div class="filter-selects">
            <select id="relatieTypeFilter">
              <option value="">Alle Type Relaties</option>
              <option value="Huurder">Huurder</option>
              <option value="Leverancier">Leverancier</option>
              <option value="Eigenaar">Eigenaar</option>
              <option value="Prospect">Prospect</option>
              <option value="Beheerder">Beheerder</option>
            </select>
          </div>
        </div>

        <div id="huurdersGrid" class="cards-grid">
          <p class="empty-state">
            Geen relaties gevonden. Klik op "Nieuwe Relatie" om te beginnen.
          </p>
        </div>

    <!-- Modal for Add/Edit Relatie -->
    <div
      id="huurderModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Nieuwe Relatie</h2>
          <button class="close-btn" id="closeModal">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="lucide-icon"
              aria-hidden="true"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>

        <form id="huurderForm">
          <input type="hidden" id="huurderId" />

          <div class="form-row">
            <div class="form-group">
              <label for="relatieType">Relatie Type</label>
              <select id="relatieType" required style="width: 100%">
                <option value="Huurder">Huurder</option>
                <option value="Leverancier">Leverancier</option>
                <option value="Eigenaar">Eigenaar</option>
                <option value="Prospect">Prospect</option>
                <option value="Beheerder">Beheerder</option>
              </select>
            </div>
            <div class="form-group">
              <label for="bedrijfsnaam">Bedrijfsnaam (Optioneel)</label>
              <input
                type="text"
                id="bedrijfsnaam"
                placeholder="Alleen voor zakelijk"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="voornaam">Voornaam *</label>
              <input type="text" id="voornaam" required />
            </div>

            <div class="form-group">
              <label for="achternaam">Achternaam *</label>
              <input type="text" id="achternaam" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">E-mailadres *</label>
              <input type="email" id="email" required />
            </div>
            <div class="form-group">
              <label for="telefoon">Telefoonnummer *</label>
              <input type="tel" id="telefoon" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="iban">IBAN Bankrekening</label>
              <input
                type="text"
                id="iban"
                placeholder="NL99 INGB 0123 4567 89"
              />
            </div>
            <div class="form-group">
              <label for="kvkNummer">KVK Nummer</label>
              <input type="text" id="kvkNummer" placeholder="bijv. 12345678" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="geboortedatum">Geboortedatum</label>
              <input type="date" id="geboortedatum" />
            </div>
          </div>

          <div class="form-group">
            <label for="notities">Notities</label>
            <textarea
              id="notities"
              rows="3"
              placeholder="Aanvullende informatie..."
            ></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Annuleren
            </button>
            <button type="submit" class="btn-primary">Opslaan</button>
          </div>
        </form>
      </div>
    </div>
